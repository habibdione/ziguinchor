<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Map region (stylized Africa) -->
  <ellipse cx="256" cy="280" rx="120" ry="100" fill="url(#mapGradient)" opacity="0.8"/>
  
  <!-- Location pin -->
  <g>
    <circle cx="256" cy="200" r="35" fill="#e74c3c"/>
    <path d="M 256 200 L 240 245 Q 256 260 272 245 Z" fill="#e74c3c"/>
    <circle cx="256" cy="200" r="25" fill="#ffffff" opacity="0.9"/>
    <circle cx="256" cy="200" r="12" fill="#e74c3c"/>
  </g>
  
  <!-- Accuracy circle (pulse-like) -->
  <circle cx="256" cy="200" r="50" fill="none" stroke="#3498db" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="200" r="70" fill="none" stroke="#3498db" stroke-width="2" opacity="0.2"/>
  
  <!-- Text: GEO -->
  <text x="256" y="420" font-size="48" font-weight="bold" text-anchor="middle" fill="#27ae60" font-family="Arial, sans-serif">GEO</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="15" fill="#3498db" opacity="0.6"/>
  <circle cx="420" cy="420" r="12" fill="#f39c12" opacity="0.6"/>
</svg>