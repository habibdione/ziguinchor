<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable icon for Android (ensures safe zone) -->
  <defs>
    <linearGradient id="maskGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle (safe zone for mask) -->
  <circle cx="256" cy="256" r="200" fill="url(#maskGradient)"/>
  
  <!-- Location pin (centered) -->
  <g>
    <circle cx="256" cy="200" r="40" fill="#e74c3c"/>
    <path d="M 256 200 L 235 260 Q 256 280 277 260 Z" fill="#e74c3c"/>
    <circle cx="256" cy="200" r="30" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="200" r="15" fill="#e74c3c"/>
  </g>
  
  <!-- Accuracy rings -->
  <circle cx="256" cy="200" r="55" fill="none" stroke="#3498db" stroke-width="3" opacity="0.5"/>
  <circle cx="256" cy="200" r="75" fill="none" stroke="#3498db" stroke-width="2" opacity="0.25"/>
  
  <!-- Map lines (grid pattern) -->
  <line x1="160" y1="300" x2="352" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="330" x2="352" y2="330" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="180" y1="280" x2="180" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <line x1="256" y1="280" x2="256" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <line x1="332" y1="280" x2="332" y2="350" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
</svg>