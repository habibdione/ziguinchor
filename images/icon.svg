<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad1)"/>
  
  <!-- Map Pin -->
  <circle cx="96" cy="70" r="35" fill="white" opacity="0.9"/>
  
  <!-- Pin point -->
  <path d="M 96 70 L 110 95 C 110 105 103.6 113 96 113 C 88.4 113 82 105 82 95 Z" fill="white"/>
  
  <!-- Inner circle -->
  <circle cx="96" cy="75" r="12" fill="#3498db"/>
  
  <!-- Grid lines for map -->
  <g stroke="white" stroke-width="2" opacity="0.3">
    <line x1="30" y1="120" x2="162" y2="120"/>
    <line x1="30" y1="145" x2="162" y2="145"/>
    <line x1="30" y1="170" x2="162" y2="170"/>
  </g>
  
  <!-- Compass rose -->
  <circle cx="150" cy="160" r="20" fill="none" stroke="white" stroke-width="1.5"/>
  <g stroke="white" stroke-width="1.5" opacity="0.7">
    <line x1="150" y1="140" x2="150" y2="120"/>
    <line x1="150" y1="180" x2="150" y2="200"/>
    <line x1="130" y1="160" x2="110" y2="160"/>
    <line x1="170" y1="160" x2="190" y2="160"/>
  </g>
</svg>
